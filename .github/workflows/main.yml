name: NestJS CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # ==========================================
  # ЭТАП 1: CI (ТЕСТЫ)
  # ==========================================
  test:
    name: 🧪 Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run E2E Tests
        run: npm run test:e2e

  # ==========================================
  # ЭТАП 2: CD (ДЕПЛОЙ)
  # ==========================================
  deploy:
    name: 🚀 Deploy to Local Laptop
    needs: test
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t cicd-nest-api .

      - name: Stop Old Container
        run: docker stop nest_container || true

      - name: Remove Old Container
        run: docker rm nest_container || true

      - name: Start New Container
        run: docker run -d -p 3000:3000 --name nest_container cicd-nest-api

  # ==========================================
  # ЭТАП 3: УВЕДОМЛЕНИЯ В TELEGRAM
  # ==========================================
  notify:
    name: 📢 Telegram Notify
    needs: [test, deploy]
    # Важно: запускать всегда, даже если предыдущие шаги упали с ошибкой
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Отправляем при успехе
      - name: Send Success Message
        if: ${{ needs.test.result == 'success' && needs.deploy.result == 'success' }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ Ура! Новая версия успешно развернута!
            📝 Коммит: ${{ github.event.head_commit.message }}
            👨‍💻 Автор: ${{ github.actor }}

      # Отправляем при провале тестов или деплоя
      - name: Send Failure Message
        if: ${{ needs.test.result == 'failure' || needs.deploy.result == 'failure' }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ Внимание! Пайплайн упал с ошибкой.
            Тесты: ${{ needs.test.result }}
            Деплой: ${{ needs.deploy.result }}
            📝 Коммит: ${{ github.event.head_commit.message }}
